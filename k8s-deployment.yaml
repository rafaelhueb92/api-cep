apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-cep-deployment
  labels:
    backstage.io/kubernetes-id: api-cep
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-cep
  template:
    metadata:
      labels:
        backstage.io/kubernetes-id: api-cep
        app: api-cep
    spec:
      containers:
        - name: app
          image: nginx:alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: api-cep-service
  labels:
    backstage.io/kubernetes-id: api-cep
spec:
  selector:
    app: api-cep
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
